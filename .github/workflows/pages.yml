name: Publier le site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Vérifier que les pages produit sont à jour
        run: node tools/generer-pages.mjs --check
      - name: Retirer du site les fichiers qui ne sont pas des pages (Worker de paiement)
        run: rm -rf worker
      - name: Version du site (version.json, lue par le Worker au paiement → SHA dans les metadata Stripe)
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > version.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
