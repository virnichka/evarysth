name: Contrôles de géométrie

# Tests des 16 modèles 3D (tools/test/) : étanchéité, nombre de solides, cotes fonctionnelles, paroi minimale,
# fiche d'impression, références figées. Une modification qui casse l'un d'eux est bloquée avant la mise en ligne.
# Barème des prix sur-mesure (assets/js/bareme.js) : empreinte de ses entrées vérifiée sans trancher ; périmé → rouge
# (relancer le workflow « Barème des prix sur-mesure », bareme.yml, sur la branche) ; prix standard sous le coût → avertissement.
# Sur PR : toujours lancé (contrôle obligatoire sur main) ; sans changement de géométrie, le job finit vert tout de suite.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["assets/js/**", "assets/models/**", "tools/**", "fabrication/**", ".github/workflows/geometrie.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometrie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometrie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Géométrie touchée ?
        id: tri
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "lancer=oui" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(assets/js/|assets/models/|tools/|fabrication/|\.github/workflows/geometrie\.yml$)'; then
            echo "lancer=oui" >> "$GITHUB_OUTPUT"
          else
            echo "lancer=non" >> "$GITHUB_OUTPUT"; echo "Aucun fichier de géométrie modifié : contrôles sautés."
          fi
      - if: steps.tri.outputs.lancer == 'oui'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Dépendances (manifold-3d, three)
        if: steps.tri.outputs.lancer == 'oui'
        working-directory: tools
        run: npm ci
      - name: Tests de géométrie
        if: steps.tri.outputs.lancer == 'oui'
        working-directory: tools
        run: node --test
      - name: Barème des prix sur-mesure à jour (empreintes, sans trancher)
        if: steps.tri.outputs.lancer == 'oui'
        run: node tools/generer-bareme.mjs --verifier
      - name: Rapport des prix (identique à la référence ; invariants en avertissements)
        if: steps.tri.outputs.lancer == 'oui'
        run: node tools/rapport-prix.mjs --verifier
