name: Contrôles de géométrie

# Tests des 16 modèles 3D (tools/test/) : étanchéité, nombre de solides, cotes fonctionnelles, paroi minimale,
# fiche d'impression, références figées. Une modification qui casse l'un d'eux est bloquée avant la mise en ligne.
on:
  pull_request:
    paths: ["assets/js/**", "assets/models/**", "tools/**", ".github/workflows/geometrie.yml"]
  push:
    branches: [main]
    paths: ["assets/js/**", "assets/models/**", "tools/**", ".github/workflows/geometrie.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometrie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Dépendances (manifold-3d, three)
        working-directory: tools
        run: npm ci
      - name: Tests de géométrie
        working-directory: tools
        run: node --test
