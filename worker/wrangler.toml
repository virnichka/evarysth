# Worker de paiement Evarysth — déployé par .github/workflows/worker.yml (ou `npx wrangler deploy`)
# Secrets (jamais ici) : `wrangler secret put STRIPE_SECRET_KEY` et `wrangler secret put STRIPE_WEBHOOK_SECRET`
# Back-office (facultatif, inactif sans eux) : GOOGLE_SA_EMAIL, GOOGLE_SA_KEY, SHEET_ID, HMAC_SECRET — voir docs/traitement-commandes.md
# Chaîne de fabrication (facultatif, éteinte sans eux, src/fabrication.js) : GH_ACTIONS_TOKEN (jeton GitHub fine-grained,
# ce dépôt, Actions : écriture) et FABRICATION_HMAC (même valeur que le secret d'Actions) — docs/guide-reglages-fabrication.md
name = "evarysth-checkout"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
# "test" : n'accepte que les clés sk_test_ / rk_test_. Passer à "live" uniquement à l'ouverture des ventes.
CHECKOUT_MODE = "test"
# Case « J'accepte les CGV » sur la page Stripe : essayée par défaut (repli automatique sur le texte) ; "non" pour la couper
# CGV_STRIPE = "non"
# Sites autorisés à créer une session (CORS + adresses de retour)
ALLOWED_ORIGINS = "https://evarysth.fr,https://www.evarysth.fr,http://localhost:8000,http://127.0.0.1:8000"

# Expéditeur des e-mails de commande (domaine authentifié dans Brevo).
# Destinataire : secret ORDER_EMAIL (jamais ici, le dépôt est public) ; clé : secret BREVO_API_KEY.
EMAIL_FROM = "commandes@evarysth.fr"
# Reply-to quand le client n'a pas laissé d'e-mail (sinon : l'e-mail du client)
REPLY_TO = "contact@evarysth.fr"

# Liens fournisseur des e-mails fabricant (bloc D) : adresse publique de ce Worker
WORKER_URL = "https://evarysth-checkout.virnichka.workers.dev"

# Page d'administration (/admin, bloc G) : servie seulement pour les requêtes relayées par le Worker d'administration
# ci-dessous (adresse ADMIN_HOST), avec un jeton Cloudflare Access valide (revérifié par le code).
# Tant que ACCESS_TEAM_DOMAIN et ACCESS_AUD sont vides, /admin répond 403 à tout le monde.
ADMIN_HOST = "evarysth-admin.virnichka.workers.dev"
# Cloudflare Zero Trust → Access : domaine de l'équipe (ex. evarysth.cloudflareaccess.com) et tag AUD de l'application
ACCESS_TEAM_DOMAIN = "lively-rice-95f4.cloudflareaccess.com"
ACCESS_AUD = "10d2ba7ddcdbe83632614d649b8a7d9b1d83b40e4b0e12b91fcaecc723ebbae6"
ADMIN_EMAILS = "evarysth@gmail.com"

# Tâche planifiée (bloc D) : e-mails selon le statut du Sheet ; sans secrets Google, elle ne fait rien
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

# STL standards (bloc E), servis par GET /fichier/<jeton>. Sans ce binding : /fichier/ répond 503 et les e-mails
# fabricant des articles standard attendent un lien STL saisi à la main. Ne décommenter qu'APRÈS `npx wrangler r2 bucket create evarysth-stl`
# (un binding vers un bucket inexistant fait échouer le déploiement). Clés : <produit>/<taille>.stl (ex. boite-rugged/m.stl) ;
# fichiers des commandes (écrits par .github/workflows/fabrication.yml) : commandes/<n° d'article>/<SHA court>/…
# Activation : Fabrication · phase 2b, après les réglages de docs/guide-reglages-fabrication.md.
# [[r2_buckets]]
# binding = "STL"
# bucket_name = "evarysth-stl"

# ─── Worker d'administration (« télécommande ») ────────────────────────────────────────────────────────────────
# Déployé par `npx wrangler deploy --env admin` (et par le workflow). Simple relais vers le Worker public (liaison
# de service PUBLIC) : aucun secret à poser sur lui. Protégé par Cloudflare Access sur son adresse workers.dev.
[env.admin]
name = "evarysth-admin"
workers_dev = true
services = [{ binding = "PUBLIC", service = "evarysth-checkout" }]

[env.admin.vars]
ROLE = "admin"

[env.admin.triggers]
crons = []

[env.admin.observability]
enabled = true
